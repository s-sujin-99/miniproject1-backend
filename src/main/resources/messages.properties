# Bean Validation(jakarta.validation) 기본 메시지를 한글로 덮어쓴다(ROADMAP T-35).
# Spring Boot가 이 파일을 MessageSource로 자동 등록하고, ValidationAutoConfiguration이 그
# MessageSource를 LocalValidatorFactoryBean의 메시지 보간기로 연결해준다 — 애노테이션마다
# message="{...}"를 붙일 필요 없이 프로젝트 전체 기본 메시지가 바뀐다.
jakarta.validation.constraints.NotNull.message=필수 입력값입니다.
jakarta.validation.constraints.NotBlank.message=필수 입력값입니다.
jakarta.validation.constraints.NotEmpty.message=필수 입력값입니다.
jakarta.validation.constraints.Size.message=길이는 {min}~{max}자 사이여야 합니다.
jakarta.validation.constraints.Min.message={value} 이상이어야 합니다.
jakarta.validation.constraints.Max.message={value} 이하여야 합니다.
jakarta.validation.constraints.DecimalMin.message={value} 이상이어야 합니다.
jakarta.validation.constraints.DecimalMax.message={value} 이하여야 합니다.
jakarta.validation.constraints.Positive.message=양수여야 합니다.
jakarta.validation.constraints.PositiveOrZero.message=0 이상이어야 합니다.
jakarta.validation.constraints.Email.message=이메일 형식이 올바르지 않습니다.
jakarta.validation.constraints.Pattern.message=형식이 올바르지 않습니다.
jakarta.validation.constraints.Past.message=과거 날짜여야 합니다.
jakarta.validation.constraints.PastOrPresent.message=오늘 이전이어야 합니다.
jakarta.validation.constraints.Future.message=미래 날짜여야 합니다.
