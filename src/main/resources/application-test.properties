# --- Database (테스트 전용, 스키마: pharmaprice_test) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=pharmaprice_test}
spring.datasource.username=${DB_USERNAME:pharmaprice}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=pharmaprice_test
spring.flyway.schemas=pharmaprice_test
