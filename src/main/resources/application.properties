spring.application.name=miniproject1-backend


# --- Database (PostgreSQL / 스키마: pharmaprice) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=pharmaprice}
spring.datasource.username=${DB_USERNAME:pharmaprice}
spring.datasource.password=${DB_PASSWORD:changeme}
# --- JPA / Hibernate ---
# validate로 두어 V1__init.sql(Flyway)과 엔티티 불일치를 기동 시점에 잡는다(DATABASE.md §9).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=pharmaprice
spring.flyway.schemas=pharmaprice
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug
# TraceIdFilter가 MDC에 심는 traceId를 모든 로그 줄에 찍는다(ROADMAP T-35) — 에러 응답의
# traceId로 로그를 그대로 검색할 수 있어야 한다.
logging.pattern.level=%5p [traceId=%X{traceId}]

# --- Pagination ---
spring.data.web.pageable.max-page-size=50

# --- JWT (shrimp-rules.md §5.2: Access Token 단일, 24시간) ---
jwt.secret=${JWT_SECRET:dev-secret-change-me-32bytes-minimum}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- OAuth2 (Google, shrimp-rules.md §5.3) ---
# openid를 넣어야 Spring이 OidcUserService로 처리해 email_verified 클레임을 신뢰성 있게 받는다.
# GOOGLE_CLIENT_ID/SECRET이 없으면 "unconfigured"로 채운다 — OAuth2ClientProperties가 빈 문자열은
# 기동 시점에 검증 실패로 처리해 앱 전체가 못 뜨기 때문에(client-id must not be empty), 값이 없을 때도
# 기동은 되고 /oauth2/authorization/google만 동작하지 않는 상태로 우아하게 남겨둔다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unconfigured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unconfigured}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# --- App ---
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.upload-dir=${UPLOAD_DIR:./uploads}

# --- File Upload (ROADMAP T-27) ---
# 업로드 API의 실제 상한은 5MB(UploadService)다. 여기는 그보다 넉넉하게 잡아서 5~10MB 파일은
# Spring이 바로 튕기지 않고 컨트롤러까지 와서 깔끔한 413 FILE_TOO_LARGE로 응답하게 한다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Recommendation Score (API.md §5, PRD.md §F3.2) ---
recommendation.weights.price=0.60
recommendation.weights.distance=0.25
recommendation.weights.freshness=0.15
recommendation.freshness-half-life-days=30
recommendation.price-window-days=90
recommendation.price-window-fallback-days=180
recommendation.outlier.iqr-multiplier=1.5
recommendation.outlier.min-samples=4
